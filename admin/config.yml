backend:
  name: github
  repo: JoDro79/woord-op-weg
  branch: main
  base_url: https://cms-auth.jodro79.workers.dev
  auth_endpoint: auth

media_folder: "afbeeldingen"
public_folder: "/afbeeldingen"

collections:
  - name: "artikelen"
    label: "Artikelen"
    folder: "_artikelen"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Categorie", name: "category", widget: "select", options: ["Geloof", "Bezinning", "Symboliek", "Geschiedenis"] }
      - { label: "Datum", name: "date", widget: "datetime" }
      - { label: "Samenvatting", name: "excerpt", widget: "text" }
      - { label: "Afbeelding URL", name: "image", widget: "string", required: false }
      - { label: "Tekst", name: "body", widget: "markdown" }

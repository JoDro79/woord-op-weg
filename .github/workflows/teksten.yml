name: Teksten publiceren

# Draait zodra er iets verandert in de map teksten/ (uploaden, wijzigen, verwijderen).
# Zet alle teksten om naar teksten.json; de website leest dat bestand in.
on:
  push:
    branches: [main]
    paths:
      - 'teksten/**'
      - 'scripts/bouw-teksten.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: teksten
  cancel-in-progress: false

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nodig om de uploaddatum van elk bestand te bepalen

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Afhankelijkheden installeren
        working-directory: scripts
        run: npm ci --no-audit --no-fund

      - name: Teksten omzetten
        run: node scripts/bouw-teksten.mjs

      - name: teksten.json vastleggen
        run: |
          git config user.name  "woord-op-weg bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A teksten.json images/
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in teksten.json"
            exit 0
          fi
          git commit -m "Teksten bijgewerkt"
          git pull --rebase origin main
          git push origin HEAD:main
